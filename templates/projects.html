{% extends "base.html" %}

{% block title %}

    Nook | Projects

{% endblock %}

{% block body %}

    <div class="form-action">
        <form action="{{ url_for('projects') }}" method="POST">
            <input type="text" name="name" placeholder="Project Name" class="input-area">
            <select name="status" class="status-select" required>
                <option value="" disabled selected>Select status...</option>
                <option value="not-started">Not started</option>
                <option value="in-progress">In Progress</option>
                <option value="on-hold">On Hold</option>
                <option value="completed">Completed</option>
            </select>
            <textarea name="summary" class="text-area" placeholder="Add project summary here..."></textarea>
            <button type="submit" class="submit-button">➕</button>
        </form>
    </div>

    <div class="current_projects">
        {% if projects %}
            {% for project in projects %}
                <div class="project-card">
                    <div class="card-header">
                        <span class="project-title cute-font">{{ project.name }}</span>
                        <span class="status-badge status-{{ project.status }}">
                            {{ project.status | replace('-', ' ') | title}}
                        </span>
                    </div>
                    <a href="{{ url_for('project_entries', project_id=project.id) }}" class="project-card-link">Details</a>
                <form action="{{ url_for('delete_row', item_type='projects', entry_id=project.id) }}" method="POST" class="delete-form">
                    <button type="submit" class="delete-button">✖</button>
                </form>
                </div>
            {% endfor %}
        {% else %}
            <p>No projects</p>
        {% endif %}
    </div>

{% endblock %}
